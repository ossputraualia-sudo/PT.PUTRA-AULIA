<!doctype html>
<html lang="id">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b1f33"
  >

  <meta
    name="description"
    content="PAG Docs Field - Dokumentasi dan pelaporan lapangan"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="css/app.css"
  >

  <title>PAG Docs Field</title>

</head>


<body>

<div id="app">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header id="appHeader">

    <div class="app-brand">

      <b>PAG DOCS</b>

      <small>FIELD</small>

    </div>


    <div class="app-actions">


      <!-- CONNECTION STATUS -->

      <div
        id="connectionStatus"
        class="connection-status"
      >

        <span class="status-dot"></span>

        <span class="status-text">
          Online
        </span>

      </div>


      <!-- SYNC -->

      <button
        id="sync"
        type="button"
        aria-label="Sinkronisasi"
        title="Sinkronisasi"
      >

        ↻

      </button>


    </div>

  </header>


  <!-- =====================================================
       MAIN VIEW
       ===================================================== -->

  <main id="view"></main>


  <!-- =====================================================
       BOTTOM NAVIGATION
       ===================================================== -->

  <nav
    id="bottomNav"
    aria-label="Navigasi utama"
  >


    <!-- BERANDA -->

    <button
      type="button"
      data-r="home"
      aria-label="Beranda"
    >

      <span class="nav-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path d="M3 10.5L12 3l9 7.5"/>

          <path d="M5 9.5V21h14V9.5"/>

          <path d="M9 21v-6h6v6"/>

        </svg>

      </span>

      <small>
        Beranda
      </small>

    </button>


    <!-- LAPORAN -->

    <button
      type="button"
      data-r="report"
      aria-label="Laporan"
    >

      <span class="nav-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <rect
            x="4"
            y="3"
            width="16"
            height="18"
            rx="2"
          />

          <path d="M8 8h8"/>

          <path d="M8 12h8"/>

          <path d="M8 16h5"/>

        </svg>

      </span>

      <small>
        Laporan
      </small>

    </button>


    <!-- NOTIFIKASI -->

    <button
      type="button"
      data-r="notification"
      aria-label="Notifikasi"
    >

      <span class="nav-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <path
            d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
          />

          <path d="M10 21h4"/>

        </svg>

      </span>

      <small>
        Notifikasi
      </small>

    </button>


    <!-- PROFIL -->

    <button
      type="button"
      data-r="profile"
      aria-label="Profil"
    >

      <span class="nav-icon">

        <svg
          width="21"
          height="21"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >

          <circle
            cx="12"
            cy="8"
            r="4"
          />

          <path
            d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"
          />

        </svg>

      </span>

      <small>
        Profil
      </small>

    </button>

  </nav>

</div>


<!-- =====================================================
     TOAST
     ===================================================== -->

<div id="toast"></div>

     ===================================================== -->

     ===================================================== -->

<script src="js/80_Drive.js"></script>

<!-- =====================================================

     ===================================================== -->

<script src="js/90_Dashboard.js"></script>

<script src="js/91_Activity.js"></script>

<!-- =====================================================
     APPLICATION
     ===================================================== -->

<script src="js/app.js"></script>


<!-- =====================================================
     SERVICE WORKER
     ===================================================== -->

<script>

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function () {

      navigator.serviceWorker
        .register("./sw.js")
        .then(function (registration) {

          console.log(
            "PAG Docs Service Worker aktif:",
            registration.scope
          );

        })
        .catch(function (error) {

          console.error(
            "Service Worker gagal:",
            error
          );

        });

    }
  );

}

</script>


</body>

</html>
