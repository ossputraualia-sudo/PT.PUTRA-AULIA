<!doctype html>
<html lang="id">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="description"
    content="PAG Docs Field - Dokumentasi dan pelaporan lapangan"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="css/app.css"
  >

  <title>PT. PUTRA AULIA KONSULTAN</title>

</head>


<body>

<div id="app">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header id="appHeader">

    <div class="app-brand">

      <b>PT. PA</b>

      <small>LAPANGAN</small>

    </div>


<div class="app-actions">

  <div
    id="connectionStatus"
    class="connection-status"
  >
    <span class="status-dot"></span>
    <span class="status-text">Online</span>
  </div>

  <button
    id="sync"
    type="button"
    aria-label="Sinkronisasi"
    title="Sinkronisasi"
  >
    ↻
  </button>

</div>


  <!-- =====================================================
       MAIN APPLICATION VIEW
       ===================================================== -->

  <main id="view"></main>


  <!-- =====================================================
       BOTTOM NAVIGATION
       ===================================================== -->

  <nav
    id="bottomNav"
    aria-label="Navigasi utama"
  >

    <button
      type="button"
      data-r="home"
    >

      <span>⌂</span>

      <small>Beranda</small>

    </button>


    <button
      type="button"
      data-r="report"
    >

      <span>▣</span>

      <small>Laporan</small>

    </button>


  <button
  type="button"
  data-r="notification"
  aria-label="Notifikasi"
>
  <span class="nav-icon">
    <svg
      width="21"
      height="21"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
      <path d="M10 21h4"/>
    </svg>
  </span>

  <small>Notifikasi</small>
</button>

    <button
      type="button"
      data-r="profile"
    >

      <span>●</span>

      <small>Profil</small>

    </button>

  </nav>

</div>


<!-- =======================================================
     TOAST / NOTIFICATION
     ======================================================= -->

<div id="toast"></div>

<!-- =======================================================
     PWA SERVICE WORKER
     ======================================================= -->

<script>

if ("serviceWorker" in navigator) {

  window.addEventListener("load", function () {

    navigator.serviceWorker
      .register("./sw.js")
      .then(function (registration) {

        console.log(
          "PAG Docs Service Worker aktif:",
          registration.scope
        );

      })
      .catch(function (error) {

        console.error(
          "PAG Docs Service Worker gagal:",
          error
        );

      });

  });

}

</script>
